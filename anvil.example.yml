port: 4300            # optional, default 4300
dataDir: ./data       # optional, default ./data (beside this file)
# url: https://my-machine.my-tailnet.ts.net   # optional: another address anvil is reached at (see README)
repos:
  - name: redis-rust         # lowercase letters, digits and dashes
    course: redis            # a CodeCrafters course slug: downloaded from github.com/codecrafters-io on first start
    language: rust           # picks the language-specific parts of the stage instructions
  - name: shell-rust
    course: shell
    language: rust
# Optional: use a course from local paths instead of downloading it.
# courses:
#   - definition: /path/to/build-your-own-redis   # a course repo folder, or a single-file course_definition.yml
#     tester: /path/to/tester                     # the tester binary; TESTER_DIR is set to its folder
# Optional: hints for failed stages (see README). Any command that reads a prompt on stdin and prints a hint.
# hint:
#   command: claude -p          # the default when claude is installed; e.g. ollama run qwen2.5-coder for local
#   maxPromptKB: 150            # the whole prompt's size; lower it for small local models
# hint: false                   # turn hints off
